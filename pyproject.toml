[build-system]
# Pinned for the same reason as `requirements-docgen.txt`: the backend decides
# the METADATA of the artifact (today `Metadata-Version: 2.5`), and a release
# build must not depend on whatever hatchling shipped that morning. There is no
# lockfile behind this -- in a build-system table the pin IS the lock.
# Moving it: rebuild, `twine check`, and diff the sdist file list first.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "uvd-em-sdk"
# Single source of truth: uvd_em_sdk/__init__.py::__version__
# (hatch reads it at build time — see [tool.hatch.version]).
dynamic = ["version"]
description = "Python SDK for the Execution Market API — publish tasks, manage workers, handle payments"
readme = "README.md"
# SPDX expression + the file itself. `{ text = "MIT" }` put the word "MIT" in
# the metadata and shipped NO license text: the sdist and the wheel carried
# none, so what PyPI showed was a claim with nothing behind it. `license-files`
# is what puts LICENSE into both artifacts.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Ultravioleta DAO", email = "dev@ultravioletadao.xyz" },
]
keywords = ["execution-market", "ai-agents", "mcp", "x402", "erc8004"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # Measured, not assumed: 387/387 on a clean 3.13 venv (2026-09-21). No
    # 3.14 claim until the suite runs on it -- classifiers freeze into the
    # metadata of a version that can never be republished.
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
    # HARD dependency since 0.9.0 (it was the optional [wallet] extra): the
    # escrow signature is uvd_x402_sdk.escrow_signing, re-exported by
    # uvd_em_sdk.escrow_signing, and every production write is signed with
    # its wallet adapters. [wallet] brings eth-account (eth-abi, eth-utils).
    # The floor is the release whose escrow_signing API is stable.
    # uvd_em_sdk/_deps.py re-checks the floor at import;
    # tests/test_dependencies.py pins both ends here and there.
    # Ceiling <0.94 -> <0.95 (0.9.1): Execution Market pins 0.94.0 and
    # consumes this package in the same environment. 0.93.0 -> 0.94.0 leaves
    # escrow_signing, wallet and erc8128 byte-identical and
    # erc8004.supports_relayed_feedback identical by AST; the suite passes on
    # both (CHANGELOG 0.9.1).
    # Ceiling <0.95 -> <0.98 (0.9.2): Execution Market moves to 0.97.0. From
    # 0.94.0 to 0.97.0, wallet, erc8128 and erc8004 are byte-identical; the
    # escrow_signing this package re-exports refuses more before signing (a
    # config the SDK's escrow tables contradict, a chain without rows, windows
    # above their ceilings) and signs the same bytes otherwise. The suite passes
    # on 0.95.0, 0.96.0 and 0.97.0 (CHANGELOG 0.10.0; 0.9.2 was never released).
    # Ceiling <0.98 -> <1.0 (0.10.0): until 0.9.2 the ceiling kept each next
    # minor out until this suite had run against it, and it expired faster
    # than this package could ship. 0.98.0 and 0.99.0 came out the same day
    # as 0.97.0, so the 0.9.2 ceiling excluded the latest release before
    # anyone could publish it. From 0.97.0 to 0.99.0, everything this package
    # imports (escrow_signing, escrow_contracts, erc7702, networks, wallet,
    # erc8128, erc8004, exceptions) is byte-identical in the published wheels.
    # The ceiling keeps the next major out (1.0.0 and its pre-releases).
    # Trade-off: a future 0.x minor now installs without this suite having
    # run against it. The guard is CI: the ci job resolves the newest release
    # under this ceiling on every run, and the uvd-x402-sdk job runs the suite
    # on each published minor from 0.95.0 to 0.99.0.
    "uvd-x402-sdk[wallet]>=0.93.0,<1.0",
]

[project.optional-dependencies]
realtime = [
    "websockets>=12.0",
]
all = [
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "websockets>=12.0",
    # Pinned like the backend job: an open range let 0.16.0 in (2026-07-23)
    # and its formatter reflows code no one touched, so CI fails on unrelated
    # PRs. Bumping the pin requires reformatting the package in the same PR.
    "ruff==0.15.22",
]

[project.urls]
Homepage = "https://execution.market"
Documentation = "https://api.execution.market/docs"
Repository = "https://github.com/UltravioletaDAO/uvd-em-sdk-python"
Issues = "https://github.com/UltravioletaDAO/uvd-em-sdk-python/issues"

[tool.hatch.version]
path = "uvd_em_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["uvd_em_sdk"]

# Everything the sdist carries is PUBLIC, and a released sdist cannot be
# replaced. `docs/` here is repo-internal notes, not SDK documentation, so it
# is excluded; `tests/`, `examples/`, `scripts/` and `vendor/` stay because
# they are the package's own and the parity tests call `scripts/sync_*.py`
# against `vendor/em/` (fields of public data only: scripts/vendor_em.py).
# Rationale and the content audit were written while this package lived in
# the Execution Market monorepo (docs/architecture/em-plugin-sdk-packaging.md
# there).
[tool.hatch.build.targets.sdist]
exclude = [
    "docs",
    ".gitignore",
    # The repository's CI, not the package's: nothing in it builds or tests
    # an installed sdist.
    ".github",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
