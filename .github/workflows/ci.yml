name: ci

# Checks only: nothing here publishes. One job, Python 3.11: install, ruff (pinned in [dev]), tests.
on:
  pull_request:
    branches: [main]
    paths:
      - "uvd_em_sdk/**"
      - "tests/**"
      - "scripts/**"
      - "examples/**"
      - "pyproject.toml"
      - "README.md" # tests/test_readme_quickstart.py runs its snippet
      - "LICENSE"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read # checkout only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff format
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: Tests, offline (anything not on 127.0.0.1 goes to a dead proxy)
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: python -m pytest -q -rs
