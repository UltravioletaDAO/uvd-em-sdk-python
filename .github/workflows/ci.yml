name: ci

# Checks only: nothing here publishes. Python 3.11. `ci`: install, ruff (pinned in [dev]), tests on the
# uvd-x402-sdk that resolves (the newest under the ceiling). `uvd-x402-sdk`: the tests on each published minor.
on:
  pull_request:
    branches: [main]
    paths:
      - "uvd_em_sdk/**"
      - "tests/**"
      - "scripts/**"
      - "vendor/**" # the EM data tests/test_{networks,enums}_sync.py compare against
      - ".gitattributes" # tests/test_vendor_em.py reads it
      - "examples/**"
      - "pyproject.toml"
      - "README.md" # tests/test_readme_quickstart.py runs its snippet
      - "LICENSE"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read # checkout only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff format
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: Tests, offline (anything not on 127.0.0.1 goes to a dead proxy)
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: python -m pytest -q -rs

  uvd-x402-sdk:
    # Since 0.10.0 the uvd-x402-sdk ceiling is <1.0 and no longer keeps each new 0.x minor out
    # (pyproject.toml, CHANGELOG 0.10.0): the suite runs offline on each published minor of the range.
    # tests/test_dependencies.py::TESTED lists the same versions; add a leg there and here together.
    name: Tests on uvd-x402-sdk ${{ matrix.x402 }} (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        x402: ["0.95.0", "0.96.0", "0.97.0", "0.98.0", "0.99.0"]
    env:
      X402: ${{ matrix.x402 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install, with the leg's uvd-x402-sdk
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "uvd-x402-sdk[wallet]==$X402"

      - name: The installed uvd-x402-sdk is the leg's
        run: python -c "import os, uvd_x402_sdk as m; assert m.__version__ == os.environ['X402'], m.__version__"

      - name: Tests, offline (anything not on 127.0.0.1 goes to a dead proxy)
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: python -m pytest -q -rs
