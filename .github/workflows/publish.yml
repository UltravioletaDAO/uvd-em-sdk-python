name: publish

# Manual only: a person runs it from the Actions tab, on main, with the version to publish. It never
# runs on push, tag or merge. Trusted publishing (OIDC) to PyPI: no tokens, no secrets. The version
# is checked and the tests run once, in `check`; the sdist and the wheel are built once, in `build`,
# without `id-token`; only the job that publishes gets `id-token`, and only inside the `pypi`
# environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must equal __version__ in uvd_em_sdk/__init__.py"
        required: true
        type: string

permissions:
  contents: read # jobs that publish add id-token themselves

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check version and tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: The input version must be the package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pkg=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' uvd_em_sdk/__init__.py)
          if [ "$INPUT_VERSION" != "$pkg" ]; then
            echo "::error::input $INPUT_VERSION, uvd_em_sdk/__init__.py $pkg"
            exit 1
          fi

      - name: The distribution keeps its name (PyPI trusted publishing is set up for it)
        run: |
          name=$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$name" != "uvd-em-sdk" ]; then
            echo "::error::pyproject name $name (want uvd-em-sdk)"
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests, offline (anything not on 127.0.0.1 goes to a dead proxy)
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: python -m pytest -q -rs

  build:
    name: Build the sdist and the wheel
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build, then check the metadata and the file names
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m twine check --strict dist/*
          expected=$(printf '%s\n' "uvd_em_sdk-$INPUT_VERSION-py3-none-any.whl" "uvd_em_sdk-$INPUT_VERSION.tar.gz")
          actual=$(cd dist && printf '%s\n' * | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::dist/ holds: $actual"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      id-token: write # trusted publishing (OIDC), only in the job that publishes
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
